name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  channel:
    name: channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.detect.outputs.prerelease }}
    steps:
      - id: detect
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.]?(rc|alpha|beta|a|b)[0-9]*(\.[0-9]+)?)$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag '$TAG' is neither X.Y.Z nor X.Y.Z<rc|alpha|beta|a|b>N"
            exit 1
          fi

  build:
    needs: channel
    uses: ./.github/workflows/build.yml

  publish:
    needs: [channel, build]
    uses: ./.github/workflows/publish.yml
    with:
      prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}

  announce:
    needs: [channel, publish]
    uses: ./.github/workflows/discord.yml
    with:
      release_tag: ${{ github.ref_name }}
      discord_title: >-
        ${{ needs.channel.outputs.prerelease == 'true'
            && '||@release-cli|| New release candidate published'
            || '||@release-cli|| New release published' }}
      discord_color: ${{ needs.channel.outputs.prerelease == 'true' && 16776960 || 5814783 }}
    secrets: inherit
