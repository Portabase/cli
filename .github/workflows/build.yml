name: Build binaries

on:
  workflow_call:
    inputs:
      version:
        description: "Version baked into the binary. Default: the one in pyproject.toml."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: macos
            arch: amd64
            runner: macos-15-intel
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
    defaults:
      run:
        shell: bash
    env:
      NAME: portabase_${{ matrix.os }}_${{ matrix.arch }}
      BINARY: portabase_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # perl rather than sed -i, which differs between GNU and BSD (macOS).
      - name: Set version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/' pyproject.toml

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          name: ${{ env.NAME }}

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.path }}

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY }}
          path: ${{ steps.build.outputs.path }}
