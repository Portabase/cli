name: Plumber

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: plumber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: getplumber/plumber@fc8d9269c898f13c32741fec2d270662bdc3e41c # v0.5.6
        with:
          score-push: true
          upload-sarif: false
          soft-fail: true
